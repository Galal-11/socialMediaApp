<div class="min-h-screen bg-[#0b1120] text-white px-4 py-10">
  <div class="max-w-2xl mx-auto">
    <div class="mb-10">
      <h1 class="text-3xl font-bold">Settings</h1>
      <p class="text-slate-400 mt-2">Manage your account settings</p>
    </div>

    <div class="bg-[#151e30] border border-slate-700 rounded-2xl p-6 mb-8 flex items-center gap-4">
      <div class="w-16 h-16 rounded-full bg-blue-600/20 flex items-center justify-center">
        <i class="fa-solid fa-user text-blue-400 text-2xl"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold">{{ user.name }}</h2>
        <p class="text-slate-400 text-sm">{{ user.email }}</p>
      </div>
    </div>

    <div>
      <h2 class="text-lg font-bold mb-4">Security</h2>

      <div class="bg-[#151e30] border border-slate-700 rounded-2xl p-5">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-blue-500/10 flex items-center justify-center">
            <i class="fa-solid fa-lock text-blue-400 text-xl"></i>
          </div>

          <div class="flex-1">
            <h3 class="font-semibold">Change Password</h3>
            <p class="text-slate-400 text-sm mt-1">Update your account password</p>
          </div>
        </div>

        <button
          routerLink="/change"
          type="button"
          class="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition"
        >
          Change Password
        </button>
      </div>
    </div>
  </div>
</div>
